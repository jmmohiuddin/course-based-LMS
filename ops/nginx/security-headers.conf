# Included by nimikh.conf in every context that sets its own add_header (nginx does not merge them).
# No Content-Security-Policy on purpose: the player embeds Bunny Stream iframes, and a wrong CSP breaks quizzes silently.
# Add one in Report-Only mode first.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
