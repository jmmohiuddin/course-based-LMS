# Nimikh LMS: Nginx + PHP-FPM 8.3 site, origin behind Cloudflare.
# Install:  /etc/nginx/conf.d/nimikh.conf  (this file is included in the http{} context, so the
#           fastcgi_cache_path/map directives below are valid at top level)
#           /etc/nginx/snippets/nimikh/{cloudflare-realip.conf,security-headers.conf}  (siblings of this file)
# Adjust: server_name, root, fastcgi_pass socket, TLS certificate paths. Then: nginx -t && systemctl reload nginx.
# STATUS: reviewed by hand, never run against a live nginx (no nginx available where this was written). Run `nginx -t` first.

# ---- Real client IP from Cloudflare (CF-Connecting-IP) -------------------------------------------------------------
# Trusted only when the TCP peer is a Cloudflare range; everyone else cannot spoof the header.
include /etc/nginx/snippets/nimikh/cloudflare-realip.conf;

# ---- Page cache -----------------------------------------------------------------------------------------------------
fastcgi_cache_path /var/cache/nginx/nimikh levels=1:2 keys_zone=NIMIKH:50m max_size=512m inactive=30m use_temp_path=off;

# 1 = do not read from or write to the cache.
map $request_method $nimikh_skip_method {
    default 1;
    GET     0;
    HEAD    0;
}
# Logged-in users, password-protected posts, commenters, WooCommerce carts/sessions.
map $http_cookie $nimikh_skip_cookie {
    default 0;
    "~*(wordpress_logged_in_|wordpress_sec_|wp-postpass_|comment_author_|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session_|tutor_)" 1;
}
# The player heartbeat, attempts, health: never cached. Whole REST tree is bypassed, a superset of /wp-json/nimikh/v1/*.
map $request_uri $nimikh_skip_uri {
    default 0;
    "~*^/wp-json/"        1;
    "~*^/\?rest_route="   1;
    "~*^/wp-admin"        1;
    "~*^/wp-login\.php"   1;
    "~*^/wp-cron\.php"    1;
    "~*^/xmlrpc\.php"     1;
    "~*(\?|&)preview="    1;
    "~*^/(cart|checkout|my-account)" 1;
}
map "$nimikh_skip_method$nimikh_skip_cookie$nimikh_skip_uri" $nimikh_skip_cache {
    "000"   0;
    default 1;
}

# Upgrade-less redirect for plain HTTP (Cloudflare "Full (strict)" talks HTTPS to the origin).
server {
    listen 80;
    listen [::]:80;
    server_name lms.example.com;
    # Allow health probes from the host itself over HTTP; everything else goes to HTTPS.
    location = /nginx-health { access_log off; return 200 "ok\n"; allow 127.0.0.1; deny all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lms.example.com;

    root /var/www/site;
    index index.php;

    # Cloudflare Origin CA certificate (or Let's Encrypt). Use SSL mode "Full (strict)" in Cloudflare.
    ssl_certificate     /etc/ssl/cloudflare/lms.example.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/lms.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 64m;      # course attachments; video goes to Bunny, never through here
    server_tokens off;

    include /etc/nginx/snippets/nimikh/security-headers.conf;

    # ---- Hard denies --------------------------------------------------------------------------------------------
    # XML-RPC is a brute-force and pingback amplification vector; the LMS does not use it.
    location = /xmlrpc.php { return 403; }
    # Dotfiles (.git, .env, .htaccess) but keep ACME challenges reachable.
    location ~ /\.(?!well-known) { return 404; }
    # Certificates are streamed only through the plugin's download route, never as static files (nginx ignores .htaccess).
    location ^~ /wp-content/uploads/nimikh-certificates/ { return 404; }
    # No PHP execution inside uploads.
    location ~* ^/wp-content/uploads/.*\.php$ { return 403; }
    location ~* \.(sql|sql\.gz|bak|log|ini|sh|zip|tar|gz|age)$ {
        # Plugin zips/backups must never sit under the web root; this is a belt-and-braces net.
        # Static assets named like this are not expected.
        return 404;
    }
    location = /wp-config.php { return 404; }
    location = /readme.html   { return 404; }
    location = /license.txt   { return 404; }

    # ---- Pretty permalinks (/verify/{code}, /institute/{slug}, PWA files are WordPress rewrite rules) --------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ---- Static assets -------------------------------------------------------------------------------------------
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|avif|ico|webmanifest)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/nimikh/security-headers.conf;   # add_header in a location drops inherited ones
        access_log off;
    }
    # The service worker must revalidate, or PWA updates stall.
    location ~* ^/(?:sw|service-worker)\.js$ {
        try_files $uri /index.php?$args;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/nimikh/security-headers.conf;
    }

    # ---- PHP-FPM + microcache ------------------------------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        # REMOTE_ADDR is already the real client IP thanks to the real_ip module.
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_cache NIMIKH;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        fastcgi_cache_bypass $nimikh_skip_cache;
        fastcgi_no_cache     $nimikh_skip_cache;
        fastcgi_cache_valid 200 301 302 5m;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_lock on;
        fastcgi_cache_use_stale error timeout updating http_500 http_503;
        # WordPress sends no-cache headers on every page; ignore them for the anonymous cache only. Responses that
        # set cookies are still never stored (Set-Cookie is deliberately not ignored).
        fastcgi_ignore_headers Cache-Control Expires;
        add_header X-Nimikh-Cache $upstream_cache_status always;
        include /etc/nginx/snippets/nimikh/security-headers.conf;
    }

    access_log /var/log/nginx/nimikh.access.log;
    error_log  /var/log/nginx/nimikh.error.log warn;
}
