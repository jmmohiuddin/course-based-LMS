# Local development stack for the Nimikh LMS plugin. NOT for production.
#   cd ops && cp .env.example .env && docker compose up -d
# WordPress:  http://localhost:8080   Mailpit UI: http://localhost:8025   Gotenberg: http://localhost:3000
name: nimikh-dev

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
  WORDPRESS_DB_USER: ${DB_USER:-wordpress}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
  WP_ENVIRONMENT_TYPE: local
  WORDPRESS_DEBUG: "1"
  # wp-config.php additions. DISABLE_WP_CRON: the `cron` service below fires wp-cron.php every minute instead.
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('DISABLE_WP_CRON', true);
    define('WP_DEBUG_LOG', true);
    define('WP_DEBUG_DISPLAY', false);
    define('WP_REDIS_HOST', 'redis');
    define('WP_REDIS_PORT', 6379);
    define('WP_HOME', 'http://localhost:${WP_PORT:-8080}');
    define('WP_SITEURL', 'http://localhost:${WP_PORT:-8080}');

x-wp-volumes: &wp-volumes
  - wp_data:/var/www/html
  # The plugin is bind-mounted, so edits on the host show up immediately. Read-write on purpose (the plugin writes nothing
  # into itself, but tooling such as composer may). Do not mount vendor/ separately.
  - ../nimikh-lms:/var/www/html/wp-content/plugins/nimikh-lms
  # Routes wp_mail() to Mailpit (see the file for details).
  - ./dev/mailpit-mu-plugin.php:/var/www/html/wp-content/mu-plugins/mailpit.php:ro

services:
  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${WP_PORT:-8080}:80"
    environment: *wp-env
    volumes: *wp-volumes
    restart: unless-stopped

  # Real cron: WordPress' own pseudo-cron is disabled, so Action Scheduler (certificate PDFs, emails) only runs from here.
  cron:
    image: wordpress:php8.3-apache
    depends_on:
      - wordpress
    environment: *wp-env
    volumes: *wp-volumes
    working_dir: /var/www/html
    # Runs as www-data so files it creates match the web container. Waits until the web container has installed wp-config.php.
    user: "33:33"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if [ -f /var/www/html/wp-config.php ]; then
            php /var/www/html/wp-cron.php >/dev/null 2>&1 || echo "wp-cron.php failed (exit $$?)"
          fi
          sleep 60
        done
    restart: unless-stopped

  db:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_USER: ${DB_USER:-wordpress}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  # Renders certificate PDFs when the Gotenberg engine is chosen in Nimikh settings. URL from WordPress: http://gotenberg:3000
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"   # web UI
      - "127.0.0.1:1025:1025"   # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped

volumes:
  wp_data:
  db_data:
